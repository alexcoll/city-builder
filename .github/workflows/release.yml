name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      BUNDLE_WITHOUT: runtime
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Verify the bundle resolves
        run: bundle lock --check

      - name: Package source distribution
        run: |
          mkdir -p dist/city-builder
          cp -r lib dist/city-builder/
          cp main.rb Gemfile Gemfile.lock README.md dist/city-builder/
          cat > dist/city-builder/run.command <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ruby main.rb
          EOF
          chmod +x dist/city-builder/run.command
          cd dist && zip -r "city-builder-${{ github.ref_name }}.zip" city-builder

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/city-builder-*.zip
